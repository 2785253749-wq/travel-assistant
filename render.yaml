services:
  - type: web
    name: travel-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AI_ENABLED
        value: true
      - key: AI_USER_DAILY_LIMIT
        value: 5
      - key: AI_GLOBAL_DAILY_LIMIT
        value: 100
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANON_SESSION_SIGNING_SECRET
        sync: false
