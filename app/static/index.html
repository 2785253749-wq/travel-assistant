<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行助手</title>
<style>:root{--ink:#15342d;--brand:#087f68}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei";color:var(--ink);background:linear-gradient(135deg,#dff5ef,#f2e8d5);min-height:100vh}main{width:min(900px,94vw);margin:5vh auto;background:#fffdf7f0;border-radius:24px;box-shadow:0 18px 60px #173c3220;overflow:hidden}header{padding:28px 32px 18px;border-bottom:1px solid #15342d18}h1{margin:0 0 8px;font-size:clamp(26px,4vw,42px)}header p{margin:0;opacity:.72}#chat{height:56vh;overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:14px}.msg{max-width:84%;padding:13px 16px;border-radius:18px;white-space:pre-wrap;line-height:1.65}.bot{align-self:flex-start;background:#e5f4ef}.user{align-self:flex-end;background:var(--brand);color:#fff}form{display:flex;gap:10px;padding:18px 24px 24px}input{flex:1;border:1px solid #15342d35;border-radius:14px;padding:14px 16px;font-size:16px}button{border:0;border-radius:14px;padding:0 24px;color:#fff;background:var(--brand);font-weight:700}</style></head>
<body><main><header><h1>旅行助手</h1><p>告诉我目的地、日期、人数、预算与偏好。</p></header><section id="chat"><div class="msg bot">你好！请描述你的旅行计划。</div></section><form id="form"><input id="input" placeholder="例如：从上海去成都玩五天……"><button>发送</button></form></main>
<script>const c=document.querySelector('#chat'),f=document.querySelector('#form'),i=document.querySelector('#input'),b=f.querySelector('button'),t=localStorage.travelThreadId||crypto.randomUUID();localStorage.travelThreadId=t;function add(x,k){let e=document.createElement('div');e.className='msg '+k;e.textContent=x;c.append(e);c.scrollTop=c.scrollHeight}f.onsubmit=async e=>{e.preventDefault();let m=i.value.trim();if(!m)return;add(m,'user');i.value='';b.disabled=true;try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,thread_id:t})}),d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');add(d.reply,'bot')}catch(e){add('暂时无法处理：'+e.message,'bot')}finally{b.disabled=false;i.focus()}}</script></body></html>
