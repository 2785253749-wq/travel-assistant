<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的游记 - Voyage 社区</title>
  <link rel="stylesheet" href="/static/community.css">
</head>
<body data-community-mine-state="loading">
  <a class="community-skip-link" href="#community-mine-main">跳到我的游记</a>

  <header class="community-header">
    <div class="community-header__brand">
      <p class="community-eyebrow">Voyage Community</p>
      <h1>我的游记</h1>
      <p>在这里查看草稿、待审核、已通过和已驳回的内容，并继续编辑或删除自己的笔记。</p>
    </div>
    <a class="community-auth-link" href="/community">返回社区</a>
  </header>

  <main id="community-mine-main" class="community-main" tabindex="-1">
    <section class="community-controls" aria-labelledby="community-mine-filter-label">
      <h2 id="community-mine-filter-label" class="community-section-title">状态筛选</h2>
      <div class="community-filters" role="toolbar" aria-label="我的游记状态">
        <button id="community-mine-tab-draft" type="button" class="community-filter" data-status="draft" aria-pressed="true">草稿</button>
        <button id="community-mine-tab-pending_review" type="button" class="community-filter" data-status="pending_review" aria-pressed="false">待审核</button>
        <button id="community-mine-tab-approved" type="button" class="community-filter" data-status="approved" aria-pressed="false">已通过</button>
        <button id="community-mine-tab-rejected" type="button" class="community-filter" data-status="rejected" aria-pressed="false">已驳回</button>
      </div>
    </section>

    <p id="community-mine-status" class="community-status" role="status" aria-live="polite">正在加载我的游记…</p>
    <section id="community-mine-error" class="community-panel community-error" hidden aria-live="polite">
      <p id="community-mine-error-message">我的游记暂不可用，请稍后重试。</p>
      <div class="community-actions">
        <button id="community-mine-retry" type="button" class="community-secondary">重试</button>
      </div>
    </section>
    <section id="community-mine-empty" class="community-panel" hidden aria-live="polite">
      当前状态下还没有游记。
    </section>
    <section id="community-mine-list" class="community-mine-list" aria-label="我的游记列表"></section>
  </main>

  <script src="/runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js" defer crossorigin="anonymous"></script>
  <script src="/static/community-client.js" defer></script>
  <script src="/static/community-mine.js" defer></script>
</body>
</html>
