<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布游记 - Voyage 社区</title>
  <link rel="stylesheet" href="/static/community.css">
</head>
<body data-community-editor-state="loading">
  <a class="community-skip-link" href="#community-editor-main">跳到发布表单</a>

  <header class="community-header">
    <div class="community-header__brand">
      <p class="community-eyebrow">Voyage Community</p>
      <h1 id="community-editor-page-title">发布旅行游记</h1>
      <p id="community-editor-page-copy">整理图片、补充地点和正文，先保存草稿，再在合适的时候提交审核。</p>
    </div>
    <a id="community-editor-back" class="community-auth-link" href="/community">返回社区</a>
  </header>

  <main id="community-editor-main" class="community-main" tabindex="-1">
    <section class="community-panel community-editor-shell">
      <p id="community-editor-status" class="community-status" role="status" aria-live="polite">正在准备编辑器…</p>
      <div id="community-editor-errors" class="community-panel community-error" hidden aria-live="polite"></div>

      <form id="community-editor-form" class="community-editor-form">
        <section class="community-editor-section">
          <div class="community-editor-section__header">
            <h2 class="community-section-title">图片</h2>
            <p class="community-editor-help">支持 JPG、PNG 和 WebP，单张最大 10 MB，最多 9 张。</p>
          </div>
          <label for="community-editor-file-input" class="community-secondary community-editor-upload-label">添加图片</label>
          <input
            id="community-editor-file-input"
            name="images"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple
          >
          <ul id="community-editor-preview-list" class="community-editor-preview-list" aria-live="polite"></ul>
        </section>

        <section class="community-editor-section">
          <label for="community-editor-title">标题</label>
          <input id="community-editor-title" name="title" type="text" maxlength="60" placeholder="例如：大理四天三夜" required>

          <label for="community-editor-location">地点</label>
          <input id="community-editor-location" name="location_name" type="text" maxlength="80" placeholder="例如：云南·大理" required>

          <label for="community-editor-category">分类</label>
          <select id="community-editor-category" name="category" required>
            <option value="">请选择分类</option>
            <option value="摄影控">摄影控</option>
            <option value="美食地图">美食地图</option>
            <option value="独自旅行">独自旅行</option>
            <option value="城市漫步">城市漫步</option>
            <option value="自然风光">自然风光</option>
            <option value="亲子游">亲子游</option>
          </select>

          <label for="community-editor-body">正文</label>
          <textarea id="community-editor-body" name="body" rows="10" maxlength="5000" placeholder="写下这次旅行最想分享的瞬间…" required></textarea>
        </section>

        <div class="community-actions community-editor-actions">
          <button id="community-editor-save" type="button" class="community-secondary">保存草稿</button>
          <button id="community-editor-submit" type="button" class="community-create-link">提交审核</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js" defer crossorigin="anonymous"></script>
  <script src="/static/community-client.js" defer></script>
  <script src="/static/community-editor.js" defer></script>
</body>
</html>
