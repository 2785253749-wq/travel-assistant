<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社区审核 · 旅行助手</title>
  <link rel="stylesheet" href="/static/iconfont.css">
  <link rel="stylesheet" href="/static/admin-community.css">
</head>
<body class="admin-community-page">
  <header class="admin-community-header">
    <a class="admin-community-back" href="/">返回首页</a>
    <span class="admin-community-kicker">社区管理</span>
  </header>

  <main id="admin-community-page" class="admin-community" aria-labelledby="admin-community-title">
    <div class="admin-community-heading">
      <p class="admin-community-eyebrow">ADMIN MODERATION</p>
      <h1 id="admin-community-title">社区审核</h1>
      <p>处理待审核游记、评论和用户举报。</p>
    </div>

    <nav class="admin-community-tabs" role="tablist" aria-label="审核队列">
      <button id="admin-community-tab-notes" type="button" role="tab" aria-selected="true" data-admin-tab="notes">游记</button>
      <button id="admin-community-tab-comments" type="button" role="tab" aria-selected="false" data-admin-tab="comments">评论</button>
      <button id="admin-community-tab-reports" type="button" role="tab" aria-selected="false" data-admin-tab="reports">举报</button>
    </nav>

    <section id="admin-community-panel" class="admin-community-panel" role="tabpanel" aria-live="polite">
      <p id="admin-community-status" class="admin-community-status">正在检查管理员权限…</p>
      <div id="admin-community-list" class="admin-community-list"></div>
      <p id="admin-community-empty" class="admin-community-empty" hidden>当前队列为空。</p>
      <div class="admin-community-actions">
        <button id="admin-community-retry" class="admin-community-button" type="button" hidden>重试</button>
        <button id="admin-community-load-more" class="admin-community-button" type="button" hidden>加载更多</button>
      </div>
    </section>
  </main>

  <dialog id="admin-community-review-dialog" class="admin-community-dialog" aria-labelledby="admin-community-dialog-title" hidden>
    <form id="admin-community-review-form" method="dialog">
      <h2 id="admin-community-dialog-title">驳回审核内容</h2>
      <p id="admin-community-dialog-target"></p>
      <label for="admin-community-review-reason">驳回原因</label>
      <textarea id="admin-community-review-reason" maxlength="500" required></textarea>
      <p id="admin-community-review-status" class="admin-community-status"></p>
      <div class="admin-community-dialog-actions">
        <button id="admin-community-review-cancel" type="button">取消</button>
        <button id="admin-community-review-submit" class="admin-community-button" type="submit">确认驳回</button>
      </div>
    </form>
  </dialog>

  <script src="/static/community-client.js" defer></script>
  <script src="/static/admin-community.js" defer></script>
</body>
</html>
