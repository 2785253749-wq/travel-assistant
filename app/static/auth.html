<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 Voyage</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-auth-mode="signin">
  <a class="skip-link" href="#auth-page-form">跳到登录表单</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="voyage-brand" href="/" aria-label="返回 Voyage 探索首页">Voyage</a>
      <p class="auth-route-label">账户</p>
    </div>
  </header>

  <main class="auth-shell" id="main-content">
    <section class="auth-page auth-page-standalone" aria-labelledby="auth-page-title">
      <div class="auth-page-card">
        <a id="auth-page-back" class="button-link secondary auth-page-back" href="/">返回</a>
        <p class="eyebrow">Voyage 账户</p>
        <h1 id="auth-page-title" tabindex="-1">登录 Voyage</h1>
        <p id="auth-page-description">登录后可以保存、打开和管理你的私有行程。</p>
        <form id="auth-page-form">
          <label for="auth-page-email">邮箱</label>
          <input id="auth-page-email" name="email" type="email" autocomplete="email" inputmode="email" required>
          <label for="auth-page-password">密码</label>
          <input id="auth-page-password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          <div class="button-row">
            <button id="auth-page-submit" type="submit">登录</button>
            <button id="auth-page-alternate" type="button" class="secondary">注册账户</button>
          </div>
        </form>
        <button id="auth-page-forgot" type="button" class="link-button">忘记密码？</button>
        <p id="auth-page-status" class="status-message" role="status" aria-live="polite"></p>
        <p class="help-text">未登录也可以临时规划；登录后才能保存和管理行程。</p>
      </div>
    </section>
  </main>

  <script src="/runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="/static/auth.js"></script>
</body>
</html>
